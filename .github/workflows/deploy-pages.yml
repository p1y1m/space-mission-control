name: Deploy Frontend to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BASE_PATH: /space-mission-control/
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/configure-pages@v5
      - name: Validate public API URL
        run: |
          if [[ ! "$VITE_API_URL" =~ ^https://[^/]+/api/v1$ ]]; then
            echo "VITE_API_URL must be a public HTTPS URL ending in /api/v1."
            echo "Set it in repository Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
